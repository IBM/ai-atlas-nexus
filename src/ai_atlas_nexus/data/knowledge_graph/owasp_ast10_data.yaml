  - id: ast04-insecure-metadata
    name: AST04 - Insecure Metadata
    description: >-
      A skill's metadata and definition files - name, description, author,
      permissions, requires, risk_tier, and the YAML/JSON/Markdown they are
      written in - are attacker-controlled inputs the loader reads with little
      or no validation. This exposes two linked weaknesses: at the semantic
      layer, fields can impersonate trusted brands, understate permissions, or
      misdeclare risk tiers to deceive the installer; at the parsing layer,
      unsafe deserialization of those same files lets an attacker embed
      executable payloads that trigger on load, before any user action.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast04.html
    isPartOf: owasp-ast10-grp-source-and-registry
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
    tag: insecure-metadata
    risk_type: agentic
    isCategorizedAs: ast10-grp-source-and-registry
    hasExternalReference:
