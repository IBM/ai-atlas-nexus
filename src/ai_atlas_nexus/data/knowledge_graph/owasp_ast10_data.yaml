  - id: ast05-untrusted-external-instructions
    name: AST05 - Untrusted External Instructions
    description: >-
      Skills routinely reference external documentation - API references, SDK
      guides, schemas, runbooks - pointing the agent at a URL or remote file to
      read at runtime. In practice that content becomes part of the skill's
      instructions: the agent loads it, trusts it as it trusts the skill, and
      acts on it with the host agent's full permissions. Yet unlike the skill
      package - which can be reviewed, signed, and version- or hash-pinned -
      this referenced content is mutable, lives outside the trust boundary,
      and has no equivalent control; it can change at any moment. It can be
      poisoned by an attacker who owns the external source, or rewritten by
      the skill's own author after the skill has passed review - so the skill
      that was audited is never the skill that actually runs.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast05.html
    isPartOf: owasp-ast10-grp-execution-boundary
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
    tag: untrusted-external-instructions
    risk_type: agentic
    isCategorizedAs: ast10-grp-execution-boundary
    hasExternalReference:
