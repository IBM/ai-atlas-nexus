  - id: ast06-weak-isolation
    name: AST06 - Weak Isolation
    description: >-
      Skills execute in the same security context as the host agent - with full
      file system access, shell access, and network egress - because sandboxing
      is either unavailable, optional, or disabled by default. This removes all
      containment guarantees and turns every installed skill into a potential
      full-system compromise.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast06.html
    isPartOf: owasp-ast10-grp-execution-boundary
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
