  - id: ast10-cross-platform-reuse
    name: AST10 - Cross-Platform Reuse
    description: >-
      Skills are increasingly ported across platforms (OpenClaw → Claude Code
      → Cursor → VS Code) without translating the security properties of
      the source format. A skill with a permission manifest on one platform is
      stripped of that manifest on another. Security controls that exist in one
      ecosystem's metadata format simply do not exist in others - creating
      exploitable gaps as skills move between platforms. Porting agentic skills
      across platforms creates critical security issues like manifest
      stripping, context loss, and uncontrolled execution.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast10.html
    isPartOf: owasp-ast10-grp-cross-platform-reuse
    type: Risk
