documents:
  - id: owasp-agentic-skills-top-10-whitepaper-v1
    name: OWASP Agentic Skills Top 10 Whitepaper (V1)
    description: >-
      The OWASP Agentic Skills Top 10 whitepaper documents ten security risks
      affecting reusable AI agent skills and provides guidance for builders,
      enterprises, marketplaces, and reviewers.
    author: OWASP Agentic Skills Top 10 Project
    url: https://owasp.org/www-project-agentic-skills-top-10/assets/publications/ast10-top10-whitepaper-2.pdf
    hasLicense: license-cc-by-sa-4.0

taxonomies:
  - id: owasp-ast10
    name: OWASP Agentic Skills Top 10
    type: RiskTaxonomy
    description: >-
      The OWASP Agentic Skills Top 10 documents ten security risks in reusable
      AI agent skills. It focuses on the skill layer, where instructions, code,
      dependencies, metadata, distribution channels, and runtime permissions
      combine to shape agent behavior.
    url: https://owasp.org/www-project-agentic-skills-top-10/
    version: 1.0 (2026 Edition)
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    hasLicense: license-cc-by-sa-4.0

