  - id: ast03-over-privileged-skills
    name: AST03 - Over-Privileged Skills
    description: >-
      Skills are granted broader permissions than their stated function
      requires - either because no permission manifest system exists, or
      because users accept all permissions without review. This creates
      excessive blast radius: a legitimate skill with overly permissive
      database access can be weaponized by a downstream prompt injection
      attack to execute DROP TABLE commands it was never meant to run.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast03.html
    isPartOf: owasp-ast10-grp-execution-boundary
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
