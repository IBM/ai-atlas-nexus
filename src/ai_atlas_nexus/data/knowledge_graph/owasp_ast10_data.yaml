  - id: ast02-supply-chain-compromise
    name: AST02 - Supply Chain Compromise
    description: >-
      Skill registries and distribution channels lack the provenance controls
      common in mature package ecosystems (npm, PyPI, Cargo). Attackers exploit
      this absence through coordinated mass uploads, dependency confusion,
      account takeover, and repository poisoning. Configuration files that
      were once passive metadata have become active execution paths - the
      CI/CD pipeline now includes skills as a first-class attack surface.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast02.html
    isPartOf: owasp-ast10-grp-source-and-registry
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
