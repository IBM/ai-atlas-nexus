  - id: ast09-no-governance
    name: AST09 - No Governance
    description: >-
      Organizations deploying AI agents lack the inventories, policies, review
      processes, and audit trails needed to manage skills at enterprise scale.
      Skills are installed by individual users with no SOC visibility, no
      approval workflow, and no revocation mechanism - creating a "shadow AI"
      layer that security teams cannot see or control.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast09.html
    isPartOf: owasp-ast10-grp-lifecycle-governance
    type: Risk
