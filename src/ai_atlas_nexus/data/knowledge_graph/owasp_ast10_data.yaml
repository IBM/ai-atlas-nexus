  - id: ast07-update-drift
    name: AST07 - Update Drift
    description: >-
      Skills are installed and forgotten. Without immutable pinning and
      automated update verification, deployed skills drift out of sync with
      known-good versions - either because patches are not applied (leaving
      known vulnerabilities open) or because auto-update mechanisms blindly
      apply upstream changes that may themselves be malicious.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast07.html
    isPartOf: owasp-ast10-grp-lifecycle-governance
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
