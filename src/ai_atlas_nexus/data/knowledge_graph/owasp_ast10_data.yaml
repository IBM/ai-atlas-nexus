entries:
  - id: ast01-malicious-skills
    name: AST01 - Malicious Skills
    description: >-
      Threat actors publish malicious skills through public repositories and
      skill marketplaces, and may also distribute them through community
      forums or trojanized or impersonated agent downloads. These skills
      appear legitimate but contain hidden payloads - credential stealers,
      reverse shells, backdoors, or social-engineering instructions embedded
      in SKILL.md prose. Because agent skills execute with the host agent
      permissions, a malicious skill can gain access to API keys, SSH
      credentials, wallet files, browser data, and shell capabilities.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast01.html
    isPartOf: owasp-ast10-grp-source-and-registry
    type: Risk
    isDefinedByTaxonomy: owasp-ast10
    tag: malicious-skills
    risk_type: agentic
    isCategorizedAs: ast10-grp-source-and-registry
