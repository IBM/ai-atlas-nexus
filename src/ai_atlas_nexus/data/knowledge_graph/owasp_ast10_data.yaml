  - id: ast08-poor-scanning
    name: AST08 - Poor Scanning
    description: >-
      Traditional code-scanning tools are often insufficient for agent skills
      because skills combine natural-language instructions with executable
      content and metadata. This hybrid format can evade pattern matching,
      regular-expression filters, and signature-based detection, allowing some
      malicious skills to pass the checks deployed by current marketplaces and
      development workflows.
    url: https://owasp.org/www-project-agentic-skills-top-10/ast08.html
