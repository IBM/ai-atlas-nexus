# External references cited by the OWASP Agentic Skills Top 10 whitepaper (V1)
documents:
  # --- Bibliography: References sections, AST01-AST10 ---
  - id: owasp-ast10-ref-snyk-toxicskills
    name: "ToxicSkills: malicious AI agent skills on ClawHub"
    description: >-
      Snyk research corpus on malicious agent skills published to public skill
      marketplaces. Cited by nine of the ten AST risks.
    author: Snyk
    url: https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub/

  - id: owasp-ast10-ref-checkpoint-caught-in-the-hook
    name: "Caught in the Hook: RCE and API token exfiltration through Claude Code project files"
    description: >-
      Analysis of repository configuration files as execution paths, covering
      CVE-2025-59536 and CVE-2026-21852.
    author: Check Point Research
    url: https://research.checkpoint.com/2026/rce-and-api-token-exfiltration-through-claude-code-project-files/

  - id: owasp-ast10-ref-antiy-clawhavoc
    name: ClawHavoc campaign analysis
    description: >-
      Antiy CERT analysis of a large-scale poisoning campaign targeting the OpenClaw skill
      market for AI agents.
    author: Antiy CERT
    url: https://www.antiy.net/Download/clawhavoc-analysis-of-large-scale-poisoning-campaign-targeting-the-openclaw-skill-market-for-ai-agents.pdf

  - id: owasp-ast10-ref-dirf-arxiv-2508-01997
