    type: Action

  - id: owasp-ast10-act-055
    name: Separate writable state by agent or trust zone
    description: >-
      Separate writable state by agent or trust zone. When state must be shared, preserve
      provenance and validate artifacts before another agent consumes them.
    hasRelatedRisk:
      - ast06-weak-isolation
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-056
    name: Require signature verification on every skill update
    description: >-
      Require cryptographic signature verification on every update and refuse unsigned
      updates.
    hasRelatedRisk:
      - ast07-update-drift
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-057
    name: Implement a freeze mode for production deployments
    description: >-
      Implement a "freeze" mode for production deployments and prohibit hot-reload in
      non-development environments.
    hasRelatedRisk:
      - ast07-update-drift
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-058
    name: Subscribe to registry advisories and alert on CVE matches
    description: >-
      Subscribe to registry security advisories and auto-alert on CVE matches for
      installed skills.
    hasRelatedRisk:
      - ast07-update-drift
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-059
    name: Validate necessary changes through a semantic security check
    description: >-
      For cases where changes are necessary, validate all changes through a semantic
      security check and make sure any substantive changes are validated with humans in the
      loop.
    hasRelatedRisk:
      - ast07-update-drift
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-060
    name: Require human approval for skill installations and updates
    description: >-
      Enforce a human-in-the-loop approval step for any skill update in enterprise
      environments, and implement an approval workflow for all skill installations,
      treating skills as software requiring security review.
    hasRelatedRisk:
      - ast07-update-drift
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-061
    name: Maintain a centralized inventory of installed skills
    description: >-
      Establish a centralized skill inventory recording name, version, hash, install date,
      installer identity, last scan status, and last-verified timestamp for every
      installed skill.
    hasRelatedRisk:
      - ast07-update-drift
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-062
    name: Deploy behavioral analysis scanners that evaluate intent
    description: >-
      Deploy behavioral analysis scanners that evaluate intent, not just signatures, using
      calibrated models combined with deterministic rules. Agent-skill-aware scanners pair
      fast static checks with optional LLM semantic analysis for exactly this purpose.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-063
    name: Scan the code layer and the natural-language layer independently
    description: >-
      Scan both the code layer and the natural-language instruction layer independently,
      recognising that shell text crosses that boundary: fenced blocks and inline commands
      in SKILL.md are instruction-layer text that is executable-layer content, as are
      tool-invocation fields and build and CI definitions. When analyzing shell text, parse
      it as the shell does rather than matching raw text, and score it based on its
      grammatical position within the parsed command. POSIX shells perform quote removal
      last and split fields on IFS after parameter expansion, so obfuscated forms reach the
      shell as commands that a rule matching the literal verb never encountered. Statically
      resolve expansions and never execute them: evaluating attacker-supplied expansions is
      code execution within the scanner.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-064
    name: Analyze each progressive-disclosure tier as a distinct trust surface
    description: >-
      Analyze each progressive-disclosure tier as a distinct trust surface, cut by how
      certainly content reaches the model rather than by content type. The metadata tier is
      loaded for every installed skill before any invocation, so score it against its own
      threshold rather than resolving it into a whole-bundle verdict where benign volume
      outweighs it. Record which tier each finding sits in and state tier coverage
      explicitly: a frontmatter parse failure can leave the always-in-context tier
      unanalyzed while the scan still reports a result.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-065
    name: Implement multi-tool scanning pipelines
    description: >-
      Implement multi-tool scanning pipelines combining pattern matching, semantic
      analysis, and a behavioral sandbox. Test skills in isolated sandboxes, observe actual
      runtime behavior, and compare it against declared behavior.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-066
    name: Treat scanner-skill results as advisory only
    description: >-
      Treat scanner skill results as advisory only; never use a skill-based scanner as the
      sole gate.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-067
    name: Continuously re-scan installed skills as scanners improve
    description: >-
      Continuously re-scan installed skills as scanner models improve, not just at install
      time.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-068
    name: Scan the entire skill directory exhaustively and emit a coverage record
    description: >-
      Scan the entire skill directory exhaustively - every file, not just those referenced
      by SKILL.md: hidden files, compiled binaries (.pyc), archives (.docx or ZIP), and
      images that can carry multimodal injection. Normalize and strip padding before
      analysis, declare every scope bound, and record its exhaustion as INCOMPLETE rather
      than silently truncating, because cost-driven scope reduction is itself attack
      surface. Require every scan to emit a machine-readable coverage record identifying
      discovered artifacts and hashes, per-artifact analyzer status, unsupported or skipped
      formats, archive and external-reference handling, and any timeout, truncation, parser
      failure, or resource-limit event, using distinct outcomes such as PASS, FAIL, and
      INCOMPLETE. Zero findings may be reported as clean only when all coverage required by
      the selected scan profile completed successfully.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-069
    name: Run every detection rule over the normalized view as well as the raw bytes
    description: >-
      Run every detection rule over the normalized view as well as the raw bytes.
      Normalization and confusable folding are distinct operations and both are required:
      NFKC folds compatibility variants such as fullwidth and mathematical alphanumerics
      but leaves cross-script homoglyphs unchanged, and neither removes invisible
      characters. As a separate step, strip zero-width characters, bidirectional
      embedding, override and isolate controls (U+202A-U+202E, U+2066-U+2069), variation
      selectors and tag characters (U+E0000-U+E007F), then re-match. Reporting the anomaly
      is not detecting the payload: a byte- or line-oriented rule cannot match a keyword
      split by an inserted zero-width character or spelled with a homoglyph. Decode
      embedded encodings iteratively and re-scan each layer until no further decoding
      applies, under an explicit depth and size bound; bound exhaustion or decoder failure
      is an INCOMPLETE coverage event, not a clean result. Report findings against the raw
      artifact, retaining the normalized view as evidence.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-070
    name: Type the scanner's finding-suppression allowlist by direction
    description: >-
      Type the scanner's own finding-suppression allowlist by direction. A reputation-based
      trusted-infrastructure list may suppress findings about where code or content is
      fetched from, and only where the specific resource is not writable by arbitrary
      parties - a pinned path or a digest-identified artifact, not any user path on the
      same host. It must never suppress a finding about where data is sent: the same
      providers host anonymously writable gists, repositories, object-storage buckets,
      paste pages and webhook endpoints, which are documented exfiltration and dead-drop
      channels. Exempt an egress destination only through a per-skill entry naming the
      specific resource, never through shared host reputation and never by inheritance.
      Compare only the host component of a parsed URL. Where the direction of a flow cannot
      be determined, do not suppress. Record every suppression, and the entry that caused
      it, in the coverage record.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-071
    name: Treat the scanner's own model as an injectable component
    description: >-
      Treat the scanner's own LLM as an injectable, attackable component: isolate untrusted
      skill content from the analyzer's instructions, and never let skill-supplied prose -
      explanatory comments, "corporate standard" framing - steer the verdict.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-072
    name: Report false-positive performance alongside detection performance
    description: >-
      Report false-positive performance alongside detection performance, measured against a
      benign corpus of real, widely installed skills, and specify the corpus size and
      provenance. Detection rate and bypass rate both measure only missed attacks and are
      optimized by convicting everything, so neither constrains over-flagging. Report per
      rule rather than in aggregate, because a single over-firing rule can dominate an
      entire result set. Since confirmed-malicious skills are a small fraction of a live
      registry, even a low single-digit false-positive rate can produce more false
      convictions than true ones. Demote common indicators such as credential references,
      external URLs, egress verbs, and subprocess execution to informational, never a
      standalone conviction, retaining them only as a conjunct in a resolved flow.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-073
    name: Treat the backbone model as a controlled, re-evaluable security dependency
    description: >-
      Treat the backbone model at each skill-execution node as a controlled, re-evaluable
      security dependency rather than a neutral interpreter: select and periodically
      re-validate the injection resistance of the model that actually executes the skill,
      especially at action-taking or otherwise privileged nodes, and do not assume a skill
      approved under one model remains safe under another. Model choice complements signing
      and scanning; it does not replace them.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-074
    name: Retain an integrity-protected evaluation record per scan result
    description: >-
      Retain an integrity-protected, host- or evaluator-generated record tying each result
      to the skill digest, model and version, policy and toolset versions or digests,
      privilege level, evaluation suite and version, date, known limits, and re-test
      trigger. If the live runtime no longer matches that profile, require re-evaluation,
      reduce privileges, require scoped approval, or refuse execution.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-075
    name: Use Agent Threat Rules as a supplementary shareable detection layer
    description: >-
      Use Agent Threat Rules (ATR) as a supplementary, shareable detection layer for
      agent-specific behaviors and indicators, combined with semantic and behavioral
      analysis rather than treated as a complete scanner. Shareable rules are only as good
      as the text they are matched against: published ATR rules are case-insensitive regex
      over a raw content field with no normalization and no positional model, so pair them
      with canonicalization and shell-parsing requirements.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-076
    name: Evaluate scanners against an adaptive adversary
    description: >-
      Evaluate scanners against an adaptive adversary, not only a fixed malicious corpus:
      give the red team query or white-box access to the scanner and report the bypass rate
      alongside the detection rate. Without this a scanner can post a high detection rate
      and remain trivially evadable; the underlying adversarial-ML result is that
      non-adaptive evaluation overstates a detector's robustness.
    hasRelatedRisk:
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-077
    name: Restrict skill installation pathways by role
    description: >-
      Restrict skill installation pathways by excluding high-risk roles from performing
      skill installs or accessing open-source skill repositories.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-078
    name: Apply agentic identity controls
    description: >-
      Apply agentic identity controls: assign non-human identities (NHIs) to agents with
      scoped credentials, and rotate them on a schedule.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-079
    name: Apply identity-first, posture-based discovery for unscannable skills
    description: >-
      Apply identity-first, posture-based discovery for skills you cannot scan: enumerate
      shadow skills from SaaS identity and posture telemetry (OAuth grants, connected-app
      inventories, NHI activity, scope assignments) rather than endpoint or registry
      scanning, and reconcile each candidate against the approved inventory so unmatched
      identities surface.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-080
    name: Treat permission and scope drift as a discovery signal
    description: >-
      Treat permission and scope drift as a continuing discovery signal: a new consent
      grant, widened OAuth scope, or fresh app-to-app connection flags a skill install or
      privilege change and should feed the existing inventory and revocation workflows.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-081
    name: Integrate skill governance into CMDB, ITSM, and CASB tooling
    description: >-
      Integrate skill governance into existing CMDB, ITSM, and CASB tooling.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-082
    name: Establish a formal skill revocation process
    description: >-
      Establish a formal skill revocation process tied to offboarding and incident response
      playbooks.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-083
    name: Treat every inter-agent hand-off as an untrusted trust boundary
    description: >-
      Treat every inter-agent hand-off as an untrusted trust boundary: re-establish
      instruction-versus-data provenance at each relay rather than merely logging it.
      Upstream skill or agent output must be consumed as untrusted data downstream, since
      provenance recorded only for audit does not stop propagation.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-084
    name: Practice deliberate relay-node backbone-model placement
    description: >-
      Practice deliberate relay-node backbone-model placement: assign the most
      injection-resistant backbone model to relay and write (action-taking) nodes, and
      record backbone-model assignment per node in the skill inventory so a model swap at a
      relay is a governed change.
    hasRelatedRisk:
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-085
    name: Adopt the Universal Agentic Skill Format
    description: >-
      Adopt the OWASP Universal Agentic Skill Format for all new skill development. The
      format standardizes identity, signatures, content hashes, permissions, denied write
      paths, network allowlists, required tools, risk tier, scan status, and changelog
      metadata in one manifest that can be validated independently of any single platform.
      Authors declare the complete skill package in the manifest, sign the canonical
      content hash, and publish that signed metadata with the skill; registries and
      enterprise mirrors verify the signature, compare requested permissions against
      policy, inspect scan status, and preserve the metadata when porting the skill across
      platforms. Evaluation precedence is default-deny, and deny_write always wins over
      write for any path it lists.
    hasRelatedRisk:
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-086
    name: Require full security metadata re-validation when porting skills
    description: >-
      When porting skills across platforms, require a full security metadata
      re-validation - never assume equivalence. The project ships a browser-only
      cross-platform metadata loss simulator that takes a source manifest and a ported
      target manifest, normalizes fields, highlights lost or weakened security properties
      (for example an allowlisted egress replaced by network true), and exports a
      machine-readable JSON report suitable for pull requests or ticket evidence.
    hasRelatedRisk:
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-087
    name: Establish cross-registry threat intelligence sharing
    description: >-
      Establish cross-registry threat intelligence sharing between major skill registries.
    hasRelatedRisk:
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-088
    name: Build platform-agnostic skill scanners
    description: >-
      Build platform-agnostic skill scanners that evaluate the content layer independently
      of the runtime.
    hasRelatedRisk:
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-089
    name: Normalize security metadata fields across platform formats
    description: >-
      Normalize risk_tier, permissions, and signature fields across all platform-specific
      skill formats.
    hasRelatedRisk:
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action
