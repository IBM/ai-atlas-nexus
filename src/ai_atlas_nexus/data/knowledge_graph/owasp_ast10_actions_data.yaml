actions:
  - id: owasp-ast10-act-001
    name: Require cryptographic signatures on published skills
    description: >-
      Require cryptographic signatures (ed25519) on all published skills and reject
      unsigned installs. Bind each signature to a resolvable, revocable publisher identity
      - a key id, a publisher identifier such as a domain or did:web, and a published
      verification key - rather than a bare key, so a compromised signer can be revoked. A
      signature proves authorship, not safety: a verified publisher can still ship
      malicious content, so signing composes with behavioral scanning and reputation
      rather than replacing them.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-002
    name: Implement Merkle root signing for skill registries
    description: Implement Merkle root signing for skill registries.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-003
    name: Use layered scanning at publish time and install time
    description: >-
      Use layered scanning at publish time and install time for executable payloads,
      malicious indicators of compromise, hidden or obfuscated instructions, and
      natural-language manipulation. Traditional malware signatures and pattern matching
      alone are insufficient.
    hasRelatedRisk:
      - ast01-malicious-skills
      - ast08-poor-scanning
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-004
    name: Isolate skill execution in containers or sandboxes by default
    description: >-
      Isolate skill execution in containers or sandboxes, and require container isolation
      by default so that host-mode execution needs an explicit opt-in with documented
      risk. Container isolation constrains only the script launched inside it: a malicious
      SKILL.md can still persuade the host agent to use tools outside the container, so
      retain the skill identity, version, and content hash on every induced action and
      enforce host-side capability checks before dispatch.
    hasRelatedRisk:
      - ast01-malicious-skills
      - ast06-weak-isolation
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-005
    name: Audit skill actions through tamper-evident structured logging
    description: >-
      Audit skill actions through structured logging, covering file access, network calls,
      shell commands, and memory writes. Audit logging requires tamper-evident records to
      be compliance-grade: a log an operator controls can be edited after the fact, while
      a receipt a verifier can independently check cannot. The whitepaper proposes a
      bilateral receipt pattern in which every skill execution produces a signed admission
      receipt before execution (attempt_id, agent_id, action_type, scope, policy_version,
      decision, timestamp_ms, signature) and a signed outcome receipt after it
      (attempt_id, action_ref, terminal_state, signature), with a DENY decision producing
      an admission receipt even when nothing executes.
    hasRelatedRisk:
      - ast01-malicious-skills
      - ast09-no-governance
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-006
    name: Implement skill reputation systems
    description: >-
      Implement skill reputation systems based on community feedback and automated
      testing.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-007
    name: Protect agent identity artifacts
    description: >-
      Protect agent identity artifacts (SOUL.md, MEMORY.md, AGENTS.md, persona and config
      files): restrict read and write access, sign or version-control them, treat any
      skill request to access them as elevated-risk, and flag skills requesting write
      access for elevated review. This limits both persistence backdoors and identity
      cloning. These protections are a separate control plane from signing and scanning:
      memory poisoning and identity-file persistence are runtime, post-install attacks, so
      a signed, reputation-clean skill can still poison MEMORY.md or SOUL.md in a later
      session, which install-time gates never see.
    hasRelatedRisk:
      - ast01-malicious-skills
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-008
    name: Monitor for cognitive degradation at runtime
    description: >-
      Monitor for cognitive degradation at runtime: track starvation (memory or tool
      latency), token pressure, output health, and planner loop patterns across repeated
      skill invocations, not just at install time.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-009
    name: Quarantine and validate skill-authored memory writes
    description: >-
      Quarantine and validate any skill-authored write to MEMORY.md, SOUL.md, or a vector
      store before it is committed, rather than writing on first pass; a signed,
      reputation-clean skill can still poison memory after install.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-010
    name: Define non-overridable trust boundaries in system policy
    description: >-
      Define non-overridable trust boundaries in system policy, restate the skill trust
      level before privileged actions, and require pre-action review. Treat these controls
      as defense in depth, not as substitutes for isolation and capability enforcement.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-011
    name: Display publisher trust level, install count, and scan status in the registry UI
    description: >-
      Display skill publisher trust level, install count, and scan status in the registry
      user interface.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-012
    name: Never auto-execute Prerequisites sections
    description: >-
      Never auto-execute "Prerequisites" sections of a skill without explicit user review.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-013
    name: Hash-pin installed skills and alert on modification
    description: >-
      Pin all installed skills to immutable content hashes (sha256:) rather than version
      ranges, and alert on any modification of an installed skill.
    hasRelatedRisk:
      - ast01-malicious-skills
      - ast07-update-drift
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-014
    name: Require verified-publisher installation gates on skill registries
    description: >-
      Require verified-publisher installation gates, registry malware scanning,
      installation-time permission review, sandboxed execution, execution timeouts, and
      suspicious-behavior log monitoring for skill registry platforms.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-015
    name: Validate skills before publishing on agent and IDE platforms
    description: >-
      Validate skills before publishing on agent or IDE platforms such as Claude Code,
      Cursor, and VS Code: review code and instructions for injection paths, avoid dynamic
      code execution, use parameterized inputs, and require proper error handling.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-016
    name: Enforce secure skill manifests
    description: >-
      Enforce secure manifests: declare permissions explicitly, prefer read-only or
      outbound-only capabilities where possible, require signatures or signed metadata,
      enable audit logging, and bind execution to workspace trust or equivalent
      environment controls.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-017
    name: Skill publisher responsibilities
    description: >-
      For skill publishers: sign code, minimize permissions, document functionality and
      security measures, maintain updates, and disclose data collection and processing
      practices.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-018
    name: Platform operator responsibilities
    description: >-
      For platform operators: scan skills, verify publisher identities, warn users about
      high-risk permissions, remove malicious skills quickly, and support community
      reporting.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-019
    name: Skill user responsibilities
    description: >-
      For users: install only from trusted publishers, review granted permissions, audit
      installed skills periodically, report suspicious behavior, and keep agent platforms
      updated.
    hasRelatedRisk:
      - ast01-malicious-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-020
    name: Implement skill provenance tracking
    description: >-
      Implement skill provenance tracking: link each published skill to a verified
      code-signing identity, and have the signature cover a canonical digest of SKILL.md
      plus every declared resource file, so any post-publish tampering invalidates it.
      Standard signing schemes apply (for example ES256 or ed25519); until skill formats
      expose a first-class field, the binding can live in the SKILL.md metadata extension
      point.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-021
    name: Require transparency logs for all registry operations
    description: >-
      Require transparency logs for all registry operations (publish, update, delete),
      similar to Certificate Transparency. A plain registry membership lookup is not
      verification; cryptographic verification requires signatures, append-only inclusion
      proofs, and consistency proofs.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-022
    name: Pin all nested dependencies to immutable hashes
    description: >-
      Pin all nested dependencies to immutable hashes (sha256:), not version ranges. Note
      that hash-checking mode requires every package in the transitive tree to be hashed.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-023
    name: Treat repository configuration files as executable code
    description: >-
      Treat repository configuration files - hooks, .claude/settings.json,
      ANTHROPIC_BASE_URL and equivalents - as executable code and apply trust gates
      accordingly.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-024
    name: Scan recursive dependency trees
    description: Scan recursive dependency trees, not just top-level skill files.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-025
    name: Support an internal skill mirror or allowlist
    description: >-
      Support an internal skill mirror or allowlist for enterprise deployments.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-026
    name: Provide skill revocation infrastructure
    description: >-
      Provide revocation infrastructure: support revoking a compromised signing key
      (invalidating every skill signed with it), a single skill version by content digest,
      or an entire publisher. Hosts should consult a revocation endpoint at load time and
      cache its state within a bounded freshness window.
    hasRelatedRisk:
      - ast02-supply-chain-compromise
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-027
    name: Require skills to declare a permission manifest
    description: >-
      Require skills to declare a permission manifest covering files, network, shell, and
      tools, and reject skills without one.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-028
    name: Enforce per-skill scoped credentials
    description: >-
      Enforce per-skill scoped credentials rather than shared agent-level API keys.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-029
    name: Implement runtime permission enforcement
    description: Implement runtime permission enforcement, not just declarative manifests.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-030
    name: Bind authorization to the task the user approved
    description: >-
      Bind authorization to the task the user approved. Before each action, verify that
      the action, resource, destination, and conditions remain within that grant. If they
      do not, deny the action or require fresh approval.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-031
    name: Adopt network allowlists scoped to specific domains
    description: >-
      Adopt network allowlists scoped to specific domains rather than a binary
      network true/false capability.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-032
    name: Validate manifest declarations against observed runtime behavior
    description: >-
      Validate manifest declarations against observed runtime behavior in sandboxed
      testing, including a sandboxed pre-publish test of the permissions a skill declares.
    hasRelatedRisk:
      - ast03-over-privileged-skills
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-033
    name: Enforce a strict instruction hierarchy and separate instructions from data
    description: >-
      Enforce a strict instruction hierarchy (System > Operator > User > Skill/Tool
      Output). Never elevate skill or tool output to instruction level; treat all skill
      input and tool output as untrusted data, and tag external content with provenance
      markers so the model can distinguish data from commands. Maintain a clear separation
      between system prompts, user instructions, and externally retrieved content:
      retrieved information should be used only as reference data and must not override or
      modify the agent's system or developer instructions.
    hasRelatedRisk:
      - ast03-over-privileged-skills
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-034
    name: Validate the original caller at every step of a delegation chain
    description: >-
      Require every skill in a delegation chain to validate the original caller's
      identity, permissions, and authorization context before executing privileged
      operations. Authorization decisions should not rely solely on the immediately
      invoking skill.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-035
    name: Require explicit operator consent for persistent state changes
    description: >-
      Require explicit operator consent for persistent state changes: memory and
      identity-file writes, new tool approvals, and privilege escalations must not be
      auto-applied from injected instructions.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-036
    name: Require operator confirmation before destructive actions
    description: >-
      Require explicit operator confirmation before deleting files, writing or deleting
      agent identity artifacts, or executing binaries outside an approved allowlist.
    hasRelatedRisk:
      - ast03-over-privileged-skills
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-037
    name: Use safe parsers by default
    description: >-
      Use safe parsers by default: disable dangerous tags (!!python/object,
      !!python/apply; yaml.load replaced by yaml.safe_load) and apply an allowlist of
      permitted YAML and JSON keys, rejecting any unexpected fields.
    hasRelatedRisk:
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-038
    name: Validate metadata against a schema before deserialization
    description: >-
      Validate metadata against a schema - for example JSON Schema or Pydantic - before
      any deserialization of skill-provided data.
    hasRelatedRisk:
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-039
    name: Apply static analysis to metadata and SKILL.md prose at publish time
    description: >-
      Apply static analysis to all metadata fields and SKILL.md prose at publish time:
      flag suspicious patterns in general, and specifically ASCII smuggling, base64
      payloads, and zero-width characters invisible to human reviewers.
    hasRelatedRisk:
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-040
    name: Cross-reference declared risk tier against the permission manifest
    description: >-
      Cross-reference risk_tier declarations against the permission manifest scope.
      risk_tier is an untrusted author assertion and must be independently validated
      against the declared permissions; automated governance policies must be driven by
      permission-derived risk classification, with risk_tier used only to detect
      under-declaration or policy inconsistencies.
    hasRelatedRisk:
      - ast04-insecure-metadata
      - ast10-cross-platform-reuse
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-041
    name: Parse skill files in an isolated, least-privilege subprocess
    description: >-
      Parse skill files in an isolated, least-privilege subprocess or container - never
      deserialize with elevated privileges - and treat requirements.txt, package.json, and
      pyproject.toml as untrusted code whose installation is sandboxed.
    hasRelatedRisk:
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-042
    name: Enforce brand protection and surface metadata provenance
    description: >-
      Enforce brand and trademark protection, and surface metadata provenance - who
      declared it, when, and from which signing key - in the registry user interface.
    hasRelatedRisk:
      - ast04-insecure-metadata
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-043
    name: Pin and verify referenced external content
    description: >-
      Pin and verify referenced content: record a content hash for every external document
      a skill references at review time, and re-verify it on every load, refusing content
      that is unpinned or has drifted from the reviewed version.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-044
    name: Verify referenced content immediately before model ingestion
    description: >-
      Perform a final verification immediately before model ingestion. Treat a missing
      reference or a redirect to an unreviewed resource as a verification failure, and log
      the resolved source, version, and content digest.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-045
    name: Prefer inlining external documentation over fetching it
    description: >-
      Prefer inlining over fetching: snapshot external documentation into the signed skill
      package at publish time, so referenced content is reviewable and pinnable. When the
      content must stay current, deliver updates through a controlled, auto-updating
      marketplace channel with its own review and provenance, rather than pointing the
      skill at an uncontrollable URL.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-046
    name: Allowlist permitted reference domains
    description: >-
      Allowlist permitted reference domains: using the OWASP Universal Agentic Skill
      Format, restrict the external hosts a skill may fetch from to a vetted allowlist of
      trusted, stable domains and URL globs unlikely to lapse or turn malicious.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-047
    name: Audit references transitively
    description: >-
      Audit references transitively: follow every reference - including remote ones and
      the chains they point to - as part of the skill's attack surface, and make sure they
      too are vetted, trusted, and reputable.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-048
    name: Maintain fleet-wide visibility of referenced sources
    description: >-
      Maintain fleet-wide visibility of referenced sources: keep an inventory of which
      deployed skills fetch from which external sources, so a source that is later
      compromised, changed, or abandoned can be traced to every affected skill and
      revoked.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-049
    name: Rescan external instruction sources continuously
    description: >-
      Rescan continuously: when a skill fetches an external instruction source, treat each
      scan not as a one-time event but as a snapshot of a mutable state, and rescan often.
    hasRelatedRisk:
      - ast05-untrusted-external-instructions
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-050
    name: Bind agent control interfaces to localhost with authentication
    description: >-
      Bind agent control interfaces to localhost with authentication; never bind to
      0.0.0.0 by default.
    hasRelatedRisk:
