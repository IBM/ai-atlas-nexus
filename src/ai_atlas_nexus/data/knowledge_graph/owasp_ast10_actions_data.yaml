    type: Action

  - id: owasp-ast10-act-051
    name: Apply seccomp or AppArmor profiles
    description: >-
      Apply seccomp or AppArmor profiles to constrain the agent syscall surface.
    hasRelatedRisk:
      - ast06-weak-isolation
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-052
    name: Implement per-skill process isolation
    description: >-
      Implement per-skill process isolation so that each skill runs in its own namespace.
    hasRelatedRisk:
      - ast06-weak-isolation
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-053
    name: Restrict skill hot-reload and workspace precedence
    description: >-
      Restrict skill hot-reload and workspace precedence; require explicit user
      confirmation for workspace skill overrides.
    hasRelatedRisk:
      - ast06-weak-isolation
    hasDocumentation:
      - owasp-agentic-skills-top-10-whitepaper-v1
    isDefinedByTaxonomy: owasp-ast10
    type: Action

  - id: owasp-ast10-act-054
    name: Rate-limit and authenticate all WebSocket connections
    description: >-
      Rate-limit and authenticate all WebSocket connections, including those originating
      from localhost.
    hasRelatedRisk:
      - ast06-weak-isolation
    hasDocumentation:
