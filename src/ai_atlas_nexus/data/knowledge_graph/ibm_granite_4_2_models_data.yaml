documents:
  - id: granite-4.2-blog
    name: "Granite 4.2 LLMs: How They're Built"
    description: >-
      Technical blog post describing Granite 4.2, a family of dense, decoder-only reasoning models (3B, 8B and 30B)
      post-trained from the Granite 4.1 base models. It covers the supervised fine-tuning corpus, the multi-phase
      multi-environment reinforcement learning stage built on GRPO, the closing preference-alignment phase, and the
      built-in thinking, non-thinking and low-effort inference modes.
    author: Yousaf Shah, Swanand Kadhe, Riddhiman Moulick, Ashish Sunil Agrawal
    url: https://huggingface.co/blog/ibm-granite/granite-4-2
    dateCreated: 2026-08-25

aimodelfamilies:
  - id: ibm-granite
    hasDocumentation:
      - granite-4.2-blog

aimodels:
  - id: granite-4.2-3b
    name: Granite-4.2-3B
    description: >-
      Granite-4.2-3B is a 3B parameter long-context reasoning model post-trained from Granite-4.1-3B-Base. It performs
      chain-of-thought reasoning inside <think> tags before answering, and supports three inference modes: full
      thinking (the default), non-thinking, and low-effort thinking. It is aimed at reasoning, code generation, tool
      calling, agentic workflows and multilingual dialog.
    url: https://github.com/ibm-granite/granite-4.2-language-models
    hasModelCard:
      - "https://huggingface.co/ibm-granite/granite-4.2-3b"
    architecture: Decoder-only (dense transformer, GQA, RoPE, SwiGLU, RMSNorm, GraniteForCausalLM)
    numParameters: 3659737600
    numTrainingTokens: 15000000000000
    contextWindowSize: 131072
    dateCreated: 2026-08-25
    isProvidedBy: ibm
    isPartOf: ibm-granite
    hasDocumentation:
      - granite-4.2-blog
    hasLicense: license-apache-2.0
    hasInputModality:
      - modality-text
    hasOutputModality:
      - modality-text
    performsTask:
      - question-answering
      - summarization
      - text-classification
      - text-generation
      - code-generation
      - code-explanation
      - code-editing
    fine_tuning: >-
      Multi-stage post-training from Granite-4.1-3B-Base. Supervised fine-tuning draws on permissively licensed public
      datasets, synthetic reasoning, tool-calling and chain-of-thought data, agentic traces, and curated
      human-authored data. This is followed by multi-phase, multi-environment reinforcement learning with Group
      Relative Policy Optimization across math, code, science, instruction following, tool use, chat and
      structured-output environments, most of which provide verifiable rewards while open-ended prompts are scored by
      a generative reward model. A closing preference-alignment (RLHF) phase tunes helpfulness, conversational quality
      and safety. Reinforcement learning is carried out with NeMo RL and the environments run on NeMo Gym.
    supported_languages:
      - en
      - de
      - es
      - fr
      - ja
      - pt
      - ar
      - cs
      - it
      - ko
      - nl
      - zh
    notes:
      - >-
        The context window is 131072 tokens natively; the model card additionally documents a long-context extension
        to 512K tokens.
      - >-
        numParameters is the exact checkpoint parameter count; the model card states the nominal size as 3B.
      - >-
        numTrainingTokens reflects the approximately 15T-token pretraining corpus of the Granite 4.1 base model this
        checkpoint is post-trained from. Granite 4.2 does not publish a separate post-training token count.
      - >-
        Trained on an NVIDIA GB200 NVL72 cluster hosted at CoreWeave. Evaluations were run with a framework based on
        the NeMo Evaluator SDK.
    hasEvaluation:
      - tau3-bench-avg-granite-4.2-3b
      - bfcl-v4-granite-4.2-3b
      - profbench-granite-4.2-3b
      - aime25-granite-4.2-3b
      - hmmt-feb25-granite-4.2-3b
      - gpqa-granite-4.2-3b
      - livecodebench-v6-granite-4.2-3b
      - scicode-granite-4.2-3b
      - mmlu-pro-granite-4.2-3b
      - mmlu-prox-lite-granite-4.2-3b
      - arena-hard-v2-granite-4.2-3b
      - ifbench-prompt-granite-4.2-3b
      - ruler-64k-granite-4.2-3b
      - ruler-128k-granite-4.2-3b

