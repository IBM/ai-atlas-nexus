id: https://w3id.org/ai-atlas-nexus/ai_eval
name: ai_eval
description: Defines vocabulary relating to AI model evaluation
imports:
  - linkml:types
  - ./common
  - ./ai_risk
  - ./ai_intrinsic
default_curi_maps:
  - semweb_context
prefixes:
  linkml: https://w3id.org/linkml/
  nexus: https://w3id.org/ai-atlas-nexus/
  dqv: https://www.w3.org/TR/vocab-dqv/
  dpv: https://w3id.org/dpv#
  dcterms: http://purl.org/dc/terms/
  earl: http://www.w3.org/ns/earl#
  prov: http://www.w3.org/ns/prov#
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
default_range: string
default_prefix: nexus

enums:
  ConformanceOutcome:
    description: The outcome of assessing a condition of an evaluation standard.
    permissible_values:
      FULFILLED:
        meaning: earl:passed
        description: The condition was fulfilled.
        close_mappings:
          - dpv:Compliant
      NOT_FULFILLED:
        meaning: earl:failed
        description: The condition was not fulfilled.
        close_mappings:
          - dpv:NonCompliant
      ALTERNATIVE_MEANS:
        description: The condition was not fulfilled literally, but the same principle was achieved via alternative means.
        related_mappings:
          - earl:passed
          - dpv:PartiallyCompliant
      NOT_APPLICABLE:
        meaning: earl:inapplicable
        description: The condition does not apply to this engagement.
      NOT_ASSESSED:
        meaning: earl:untested
        description: The condition was not assessed.
        close_mappings:
          - dpv:ComplianceUnknown

classes:
  AiEval:
    in_subset:
      - core
    is_a: Entity
    class_uri: dqv:Metric
    description: >-
      An AI Evaluation, e.g. a metric, benchmark, unitxt card evaluation, a question or a combination of such entities.
    slot_usage:
      isComposedOf:
        range: AiEval
        description: >-
          A relationship indicating that an AI evaluation maybe composed of other AI evaluations (e.g. it's an overall
          average of other scores).
      hasRelatedRisk:
        domain: AiEval
        range: Risk
    slots:
      - hasDocumentation
      - hasDataset
      - hasTasks
      - hasImplementation
      - hasUnitxtCard
      - hasLicense
      - hasRelatedRisk
      - bestValue
      - hasBenchmarkMetadata
      - isComposedOf

  AiEvalResult:
    in_subset:
      - extended
    is_a: Entity
    class_uri: dqv:QualityMeasurement
    description: The result of an evaluation for a specific AI model.
    mixins:
      - Fact
    slots:
      - isResultOf

  SourceMetadata:
    is_a: Entity
    class_uri: nexus:sourcemetadata
    description: Metadata about the source of an evaluation
    attributes:
      source_name:
        description: Name of the evaluation source
        range: string
      source_type:
        description: Type of source (e.g., evaluation_run)
        range: string
      source_organization_name:
        description: Organization that provided the evaluation
        range: string
      source_organization_url:
        description: URL of the source organization
        range: uri
      evaluator_relationship:
        description: Relationship of evaluator (e.g., first_party, third_party)
        range: string

  ModelInfo:
    is_a: Entity
    class_uri: nexus:modelinfo
    description: Information about the AI model being evaluated
    attributes:
      model_name:
        description: Name of the AI model
        range: string
      model_id:
        description: Identifier of the AI model
        range: string

  SourceData:
    is_a: Entity
    class_uri: nexus:sourcedata
    description: Information about the data source used in evaluation
    attributes:
      dataset_name:
        description: Name of the dataset
        range: string
      source_type:
        description: Type of data source (e.g., hf_dataset)
        range: string
      hf_repo:
        description: HuggingFace repository
        range: string
      hf_split:
        description: HuggingFace dataset split
        range: string

  MetricConfig:
    is_a: Entity
    class_uri: nexus:metricconfig
    description: Configuration for evaluation metrics
    attributes:
      lower_is_better:
        description: Whether lower scores are better
        range: boolean
      score_type:
        description: Type of score (e.g., continuous)
        range: string
      min_score:
        description: Minimum possible score
        range: float
      max_score:
        description: Maximum possible score
        range: float

  ScoreDetails:
    is_a: Entity
    class_uri: nexus:scoredetails
    description: Details about evaluation scores
    attributes:
      score:
        description: The evaluation score
        range: float

  EvaluationResultRecord:
    is_a: Entity
    class_uri: nexus:evaluationresultrecord
    description: A single evaluation result record
    attributes:
      evaluation_name:
        description: Name of the evaluation benchmark
        range: string
    slots:
      - hasSourceData
      - hasMetricConfig
      - hasScoreDetails

  EveryEvalAIResult:
    is_a: AiEvalResult
    class_uri: nexus:everyevalairesult
    description:
      An evaluation result from the Every Eval Ever dataset, capturing evaluation metadata and results from the
      EEE_datastore.
    attributes:
      schema_version:
        description: Version of the evaluation schema
        range: string
      evaluation_id:
        description: Unique identifier for this evaluation
        range: string
      evaluation_timestamp:
        description: ISO 8601 timestamp when evaluation was performed
        range: datetime
      retrieved_timestamp:
        description: Unix timestamp when the data was retrieved
        range: string
    slot_usage:
      hasRelatedRisk:
        domain: AiEvalResult
        range: RiskConcept
    slots:
      - hasSourceMetadata
      - hasModelInfo
      - hasEvaluationResults
      - hasDataType
      - hasDomains
      - hasLanguages
      - hasTasks
      - hasDataSource
      - hasDataSize
      - hasDataFormat
      - hasMethods
      - hasMetrics
      - hasLimitations
      - hasGoal
      - hasAudience
      - hasResources
      - hasDocumentation
      - hasRelatedRisk

  BenchmarkMetadataCard:
    is_a: Entity
    class_uri: nexus:benchmarkmetadatacard
    description: >-
      Benchmark metadata cards offer a standardized way to document LLM benchmarks clearly and transparently. Inspired by
      Model Cards and Datasheets, Benchmark metadata cards help researchers and practitioners understand exactly what
      benchmarks test, how they relate to real-world risks, and how to interpret their results responsibly. This is an
      implementation of the design set out in BenchmarkCards: Large Language Model and Risk Reporting
      (https://doi.org/10.48550/arXiv.2410.12974)
    attributes:
      name:
        description: The official name of the benchmark.
      overview:
        description: A brief description of the benchmark's main goals and scope.
      type:
        range: string
        designates_type: true
    slot_usage:
      hasRelatedRisk:
        domain: BenchmarkMetadataCard
        range: RiskConcept
    slots:
      - describesAiEval
      - hasDataType
      - hasDomains
      - hasLanguages
      - hasSimilarBenchmarks
      - hasResources
      - hasGoal
      - hasAudience
      - hasTasks
      - hasLimitations
      - hasOutOfScopeUses
      - hasDataSource
      - hasDataSize
      - hasDataFormat
      - hasAnnotation
      - hasMethods
      - hasMetrics
      - hasCalculation
      - hasInterpretation
      - hasBaselineResults
      - hasValidation
      - hasRelatedRisk
      - hasDemographicAnalysis
      - hasConsiderationPrivacyAndAnonymity
      - hasLicense
      - hasConsiderationConsentProcedures
      - hasConsiderationComplianceWithRegulations
      - hasDocumentation

  ThirdPartyEvaluationEngagement:
    is_a: Entity
    class_uri: nexus:ThirdPartyEvaluationEngagement
    close_mappings:
      - prov:Activity
    related_mappings:
      - dpv:Assessment
    description: >-
      A single engagement in which an independent third-party evaluator evaluates one or more AI systems of a system
      provider, using one or more benchmarks or other evaluations, and reports the operating conditions of the
      engagement against evaluation standards such as AEF-1.
    slot_usage:
      hasEvaluation:
        description: The results produced by the engagement, across all of its evaluations.
    slots:
      - hasEvaluator
      - hasSystemProvider
      - evaluatesAi
      - usesEvaluation
      - hasEvaluation
      - hasStandardConformance
      - startDate
      - endDate
      - hasDocumentation

  EvaluationStandardConformance:
    class_uri: nexus:EvaluationStandardConformance
    related_mappings:
      - dpv:ComplianceStatus
    description: A completed checklist reporting how an engagement addressed the conditions of an evaluation standard.
    slot_usage:
      conformsToStandard:
        required: true
    slots:
      - conformsToStandard
      - satisfiesAllRequirements
      - hasConditionAssessment

  ConditionAssessment:
    class_uri: nexus:ConditionAssessment
    close_mappings:
      - earl:Assertion
    related_mappings:
      - earl:TestResult
    description: One answer of a completed checklist, for one condition of the evaluation standard.
    slot_usage:
      assessesCondition:
        required: true
      hasConformanceOutcome:
        required: true
      evidence:
        description: Notes or evidence supporting the answer, e.g. a link to a published policy.
    slots:
      - assessesCondition
      - hasConformanceOutcome
      - evidence
      - justification
      - disclosureAnswer
      - appliesToEvaluation
    rules:
      - description: A justification is required when a condition is not fulfilled literally.
        preconditions:
          slot_conditions:
            hasConformanceOutcome:
              any_of:
                - equals_string: NOT_FULFILLED
                - equals_string: ALTERNATIVE_MEANS
        postconditions:
          slot_conditions:
            justification:
              required: true

  Question:
    is_a: AiEval
    description: An evaluation where a question has to be answered
    attributes:
      text:
        description: The question itself
        required: true

  Questionnaire:
    is_a: AiEval
    description: A questionnaire groups questions
    slot_usage:
      isComposedOf:
        range: Question

slots:
  hasImplementation:
    slot_uri: schema:url
    description: A relationship to a implementation defining the risk evaluation
    range: uri
    multivalued: true
    inlined: false
  hasUnitxtCard:
    slot_uri: schema:url
    description: A relationship to a Unitxt card defining the risk evaluation
    range: uri
    multivalued: true
    inlined: false
  hasBenchmarkMetadata:
    description: A relationship to a Benchmark Metadata Card which contains metadata about the benchmark.
    domain: AiEval
    range: BenchmarkMetadataCard
    multivalued: true
    inlined: false
    inverse: describesAiEval
  describesAiEval:
    description: >-
      A relationship where a BenchmarkMetadataCard describes an AI evaluation (benchmark).
    domain: BenchmarkMetadataCard
    range: AiEval
    multivalued: true
    inlined: false
    inverse: hasBenchmarkMetadata
  bestValue:
    description: Annotation of the best possible result of the evaluation
  hasEvaluation:
    slot_uri: dqv:hasQualityMeasurement
    description: A relationship indicating that an entity has an AI evaluation result.
    range: AiEvalResult
    multivalued: true
  isResultOf:
    slot_uri: dqv:isMeasurementOf
    description: A relationship indicating that an entity is the result of an AI evaluation.
    range: AiEval
    multivalued: false
    inlined: false
  hasEvaluator:
    slot_uri: nexus:hasEvaluator
    close_mappings:
      - prov:wasAssociatedWith
    related_mappings:
      - earl:assertedBy
    description: The organization that conducted the evaluation.
    range: Organization
    inlined: false
  hasSystemProvider:
    slot_uri: nexus:hasSystemProvider
    description: The organization which develops or operates the AI systems being evaluated.
    range: Organization
    inlined: false
  evaluatesAi:
    slot_uri: nexus:evaluatesAi
    related_mappings:
      - earl:subject
    description: The AI systems or models (including specific versions) evaluated in the engagement.
    range: BaseAi
    multivalued: true
    inlined: false
  usesEvaluation:
    slot_uri: nexus:usesEvaluation
    close_mappings:
      - prov:used
    description: The benchmarks, metrics, or other AI evaluations run as part of the engagement.
    range: AiEval
    multivalued: true
    inlined: false
  hasStandardConformance:
    slot_uri: nexus:hasStandardConformance
    description: The completed checklist(s) of evaluation standards (e.g. AEF-1) that the engagement reports against.
    range: EvaluationStandardConformance
    multivalued: true
    inlined: true
    inlined_as_list: true
  conformsToStandard:
    slot_uri: dcterms:conformsTo
    description: The evaluation standard the checklist is completed against.
    range: EvaluationStandard
    inlined: false
  satisfiesAllRequirements:
    slot_uri: nexus:satisfiesAllRequirements
    description: >-
      The overall answer to whether the engagement satisfies all the minimum requirements of the standard.
    range: boolean
  hasConditionAssessment:
    slot_uri: nexus:hasConditionAssessment
    description: The per-condition answers of a completed checklist.
    range: ConditionAssessment
    multivalued: true
    inlined: true
    inlined_as_list: true
  assessesCondition:
    slot_uri: earl:test
    description: The condition of the evaluation standard that is assessed.
    range: ControlActivity
    inlined: false
  hasConformanceOutcome:
    slot_uri: earl:outcome
    close_mappings:
      - dpv:hasComplianceStatus
    description: Whether the condition was fulfilled.
    range: ConformanceOutcome
  justification:
    slot_uri: nexus:justification
    related_mappings:
      - earl:info
    description: >-
      Why a condition was not fulfilled, or how the same principle was achieved via alternative means.
    range: string
  disclosureAnswer:
    slot_uri: nexus:disclosureAnswer
    description: >-
      For disclosure conditions (e.g. AEF-1 2.4.x), whether the disclosed circumstance applies,
      e.g. true if the evaluator was paid by the system provider. Independent of whether the condition was fulfilled.
    range: boolean
  appliesToEvaluation:
    slot_uri: nexus:appliesToEvaluation
    description: >-
      The evaluations of the engagement that this answer is specific to. When absent, the answer applies to the
      engagement as a whole.
    range: AiEval
    multivalued: true
    inlined: false
  startDate:
    slot_uri: schema:startDate
    close_mappings:
      - prov:startedAtTime
    description: The date on which the entity started.
    range: date
  endDate:
    slot_uri: schema:endDate
    close_mappings:
      - prov:endedAtTime
    description: The date on which the entity ended.
    range: date
  hasDataType:
    description: The type of data used in the benchmark (e.g., text, images, or multi-modal)
    multivalued: true
  hasDomains:
    description: >-
      The specific domains or areas where the benchmark is applied (e.g., natural language processing, computer vision).
    multivalued: true
  hasLanguages:
    description: The languages included in the dataset used by the benchmark (e.g., English, multilingual).
    multivalued: true
  hasSimilarBenchmarks:
    description: Benchmarks that are closely related in terms of goals or data type.
    multivalued: true
  hasResources:
    description: Links to relevant resources, such as repositories or papers related to the benchmark.
    multivalued: true
  hasGoal:
    description: The specific goal or primary use case the benchmark is designed for.
  hasAudience:
    description: The intended audience, such as researchers, developers, policymakers, etc.
    multivalued: true
  hasTasks:
    description: The tasks or evaluations the benchmark is intended to assess.
    multivalued: true
    inlined: false
  hasLimitations:
    description: >-
      Limitations in evaluating or addressing risks, such as gaps in demographic coverage or specific domains.
    multivalued: true
  hasOutOfScopeUses:
    description: >-
      Use cases where the benchmark is not designed to be applied and could give misleading results.
    multivalued: true
  hasDataSource:
    description: >-
      The origin or source of the data used in the benchmark (e.g., curated datasets, user submissions).
    multivalued: true
  hasDataSize:
    description: The size of the dataset, including the number of data points or examples.
  hasDataFormat:
    description: >-
      The structure and modality of the data (e.g., sentence pairs, question-answer format, tabular data).
    multivalued: true
  hasAnnotation:
    description: >-
      The process used to annotate or label the dataset, including who or what performed the annotations (e.g., human
      annotators, automated processes).
    multivalued: true
  hasMethods:
    description: The evaluation techniques applied within the benchmark.
    multivalued: true
  hasMetrics:
    description: >-
      The specific performance metrics used to assess models (e.g., accuracy, F1 score, precision, recall).
    multivalued: true
  hasCalculation:
    description: The way metrics are computed based on model outputs and the benchmark data.
    multivalued: true
  hasInterpretation:
    description: How users should interpret the scores or results from the metrics.
    multivalued: true
  hasBaselineResults:
    description: >-
      The results of well-known or widely used models to give context to new performance scores.
    multivalued: true
  hasValidation:
    description: >-
      Measures taken to ensure that the benchmark provides valid and reliable evaluations.
    multivalued: true
  hasDemographicAnalysis:
    description: >-
      How the benchmark evaluates performance across different demographic groups (e.g., gender, race).
    multivalued: true
  hasConsiderationPrivacyAndAnonymity:
    description: >-
      How any personal or sensitive data is handled and whether any anonymization techniques are applied.
    multivalued: true
  hasConsiderationConsentProcedures:
    description: >-
      Information on how consent was obtained (if applicable), especially for datasets involving personal data.
    multivalued: true
  hasConsiderationComplianceWithRegulations:
    description: >-
      Compliance with relevant legal or ethical regulations (if applicable).
    multivalued: true
  hasSourceMetadata:
    description: Source metadata for the evaluation
    domain: EveryEvalAIResult
    range: SourceMetadata
    inlined: true
  hasModelInfo:
    description: Model information for the evaluation
    domain: EveryEvalAIResult
    range: ModelInfo
    inlined: true
  hasSourceData:
    description: Source data information
    domain: EvaluationResultRecord
    range: SourceData
    inlined: true
  hasMetricConfig:
    description: Metric configuration
    domain: EvaluationResultRecord
    range: MetricConfig
    inlined: true
  hasScoreDetails:
    description: Score details
    domain: EvaluationResultRecord
    range: ScoreDetails
    inlined: true
  hasEvaluationResults:
    description: Array of evaluation results
    domain: EveryEvalAIResult
    range: EvaluationResultRecord
    multivalued: true
    inlined: true
